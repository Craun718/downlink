[workspace]
members = ["crates/markdown-plain-text"]

[package]
name = "notify-core"
version = "0.1.0"
edition = "2024"

[dependencies]
markdown-plain-text = { path = "crates/markdown-plain-text" }
async-trait = "0.1.91"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
url = "2.5.8"
hmac = "0.12.1"
sha2 = "0.10.9"
base64 = "0.22.1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros"], optional = true }
reqwest = { version = "0.12.28", features = ["json"], optional = true }
lettre = { version = "0.11.23", features = ["smtp-transport", "builder", "tokio1", "tokio1-native-tls"], optional = true }

[features]
default = [
    "default-client",
    "channel-dingtalk",
    "channel-feishu",
    "channel-telegram",
    "channel-discord",
    "channel-serverchan",
    "channel-bark",
    "channel-gotify",
    "channel-qmsg",
    "channel-wxpusher",
    "channel-webhook",
]
default-client = ["dep:reqwest", "dep:tokio"]
channel-dingtalk = []
channel-feishu = []
channel-telegram = []
channel-discord = []
channel-serverchan = []
channel-bark = []
channel-gotify = []
channel-qmsg = []
channel-wxpusher = []
channel-webhook = []
channel-smtp = ["dep:lettre"]
